# Imagenes del servidor (Sprint 6a): en cada cambio de master, GitHub construye las imagenes de la
# aplicacion y del contenedor de respaldos para amd64 y arm64 (Oracle Ampere) y las publica en el registro
# de GitHub (ghcr.io), con dos etiquetas: el commit completo (la que usa actualizar.sh) y "latest".
# El servidor solo las descarga: actualizar ya no compila nada ni necesita memoria para hacerlo.
#
# La primera vez que se publican, los paquetes quedan privados: en GitHub -> perfil -> Packages ->
# asadagest-app (y asadagest-respaldo) -> Package settings -> Change visibility -> Public. Ver
# despliegue/LEEME.md, "Imagenes construidas por GitHub".
name: Imagenes

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagenes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: asadagest-app
            contexto: .
            dockerfile: Dockerfile
          - nombre: asadagest-respaldo
            contexto: despliegue/respaldo
            dockerfile: despliegue/respaldo/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Nombre de la imagen (en minusculas)
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.nombre }}" >> "$GITHUB_OUTPUT"

      # QEMU solo hace falta para la imagen de respaldo (instala paquetes de Linux para arm64). La de la
      # aplicacion compila de forma cruzada (ver Dockerfile) y no lo usa.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
            ${{ steps.nombre.outputs.imagen }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}
