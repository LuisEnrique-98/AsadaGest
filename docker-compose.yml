services:
  postgres:
    image: postgres:16
    container_name: asada_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: asada_gestion
      POSTGRES_USER: asada
      POSTGRES_PASSWORD: asada_dev_local
    ports:
      - "5432:5432"
    volumes:
      - asada_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asada -d asada_gestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sprint 5b: respaldos automaticos de la base. Un pg_dump diario a RESPALDO_HORA (y uno al arrancar
  # si hoy todavia no hay), una copia semanal, retencion por cantidad y una prueba de restauracion
  # semanal. Los archivos quedan en la carpeta ./respaldos del proyecto (fuera de Git). Ver
  # scripts/respaldos/ y la seccion "Respaldos" del README.
  respaldo:
    image: postgres:16
    container_name: asada_respaldo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: asada_gestion
      PGUSER: asada
      PGPASSWORD: asada_dev_local
      # Hora de Costa Rica (UTC-6, sin horario de verano). Formato POSIX: no depende de tzdata.
      TZ: CST6
      RESPALDO_HORA: "02:30"
      RESPALDO_DIARIOS: "30"
      RESPALDO_SEMANALES: "12"
    volumes:
      - ./scripts/respaldos:/scripts:ro
      - ./respaldos:/respaldos
    # Copia los scripts a /opt/respaldos quitando los fines de linea de Windows (CRLF): asi funcionan
    # aunque Git los haya escrito con CRLF en una PC con Windows. Los comandos manuales usan esa copia.
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /opt/respaldos
        for f in /scripts/*.sh; do tr -d '\r' < "$$f" > "/opt/respaldos/$${f##*/}"; done
        exec bash /opt/respaldos/ciclo-respaldos.sh

volumes:
  asada_postgres_data:
